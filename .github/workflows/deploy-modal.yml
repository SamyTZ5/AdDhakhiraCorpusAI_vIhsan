# Déploie automatiquement l'application sur Modal à chaque push sur main.
# Prérequis (une seule fois) :
#   - GitHub : Settings → Secrets and variables → Actions → New repository secret
#       MODAL_TOKEN_ID et MODAL_TOKEN_SECRET (modal.com → Settings → API Tokens)
#   - Modal : Secrets → Create new secret → Custom, nommé « addhakhira »,
#       avec GEMINI_API_KEY et APP_PASSWORD
name: Déployer sur Modal

on:
  push:
    branches: [main]
  workflow_dispatch:  # bouton « Run workflow » dans l'onglet Actions

concurrency:
  group: deploy-modal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Modal
        run: pip install modal

      - name: Préparer le modèle et l'index (rapide s'ils sont déjà dans le Volume)
        run: modal run modal_app.py::prepare_assets

      - name: Déployer l'application
        run: modal deploy modal_app.py
